<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hoàn tất thông tin giao hàng và đặt đơn hàng demo tại LHU E-Shop.">
  <title>Thanh toán | LHU E-Commerce</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cart-checkout.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-container">
      <a href="../index.html" class="brand-logo"><span class="logo-icon">LHU</span><span>E-Shop</span></a>
      <button type="button" class="menu-toggle" id="menuToggle" aria-label="Mở menu điều hướng" aria-expanded="false">☰</button>
      <nav class="main-nav" id="mainNav" aria-label="Điều hướng chính">
        <ul class="nav-list">
          <li><a href="../index.html" class="nav-link">Trang chủ</a></li>
          <li><a href="./products.html" class="nav-link">Sản phẩm</a></li>
          <li><a href="./vouchers.html" class="nav-link">Voucher</a></li>
          <li><a href="./order-tracking.html" class="nav-link">Theo dõi đơn</a></li>
          <li><a href="./auction.html" class="nav-link">Đấu giá</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="./cart.html" class="action-link" aria-label="Giỏ hàng của bạn">
          <span aria-hidden="true">🛒</span><span>Giỏ hàng</span><span class="cart-counter" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </header>
  <main class="main-content">
    <div class="container commerce-page">
      <header class="commerce-heading">
        <p class="commerce-eyebrow">BƯỚC CUỐI</p>
        <h1>Thông tin đặt hàng</h1>
        <p>Đơn hàng được mô phỏng trên trình duyệt, không yêu cầu thông tin thanh toán nhạy cảm.</p>
      </header>
      <div id="checkoutFeedback" class="commerce-feedback" role="alert" aria-live="assertive" hidden></div>
      <div class="checkout-layout">
        <form id="checkoutForm" class="checkout-form" novalidate>
          <section class="checkout-panel" aria-labelledby="deliveryHeading">
            <h2 id="deliveryHeading">Thông tin người nhận</h2>
            <div class="form-field">
              <label for="fullName">Họ tên người nhận <span aria-hidden="true">*</span></label>
              <input id="fullName" name="fullName" autocomplete="name" required aria-describedby="fullNameError">
              <small id="fullNameError" class="field-error"></small>
            </div>
            <div class="form-field">
              <label for="phone">Số điện thoại <span aria-hidden="true">*</span></label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required aria-describedby="phoneError">
              <small id="phoneError" class="field-error"></small>
            </div>
            <div class="form-field">
              <label for="email">Email <span class="optional-label">(không bắt buộc)</span></label>
              <input id="email" name="email" type="email" autocomplete="email" aria-describedby="emailError">
              <small id="emailError" class="field-error"></small>
            </div>
            <div class="form-field">
              <label for="address">Địa chỉ nhận hàng <span aria-hidden="true">*</span></label>
              <input id="address" name="address" autocomplete="street-address" required aria-describedby="addressError">
              <small id="addressError" class="field-error"></small>
            </div>
            <div class="form-field">
              <label for="city">Tỉnh/thành phố <span aria-hidden="true">*</span></label>
              <input id="city" name="city" autocomplete="address-level1" required aria-describedby="cityError">
              <small id="cityError" class="field-error"></small>
            </div>
            <div class="form-field">
              <label for="orderNote">Ghi chú đơn hàng</label>
              <textarea id="orderNote" name="orderNote" rows="3" maxlength="500"></textarea>
            </div>
          </section>
          <section class="checkout-panel" aria-labelledby="paymentHeading">
            <h2 id="paymentHeading">Phương thức thanh toán</h2>
            <label class="payment-option">
              <input id="paymentMethod" type="radio" name="paymentMethod" value="cod_campus" checked>
              <span><strong>Thanh toán khi nhận hàng (COD)</strong><small>Thanh toán khi nhận sản phẩm.</small></span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="bank_transfer">
              <span><strong>Chuyển khoản mô phỏng</strong><small>Chỉ ghi nhận lựa chọn, không yêu cầu thông tin ngân hàng.</small></span>
            </label>
            <small id="paymentMethodError" class="field-error"></small>
          </section>
        </form>
        <aside class="checkout-summary checkout-panel" aria-labelledby="checkoutSummaryHeading">
          <h2 id="checkoutSummaryHeading">Đơn hàng của bạn</h2>
          <div id="checkoutItems" class="checkout-items"></div>
          <p id="checkoutVoucher" class="checkout-voucher"></p>
          <dl id="checkoutTotals" class="cart-totals"></dl>
          <button id="placeOrderButton" class="btn btn-primary cart-checkout-button" type="submit" form="checkoutForm">Xác nhận đặt hàng</button>
          <a class="continue-shopping-link" href="./cart.html">← Quay lại giỏ hàng</a>
        </aside>
      </div>
    </div>
  </main>
  <script type="module" src="../js/pages/checkout.js"></script>
</body>
</html>
